<!DOCTYPE html>
<html lang="en">
<head>
    <title></title>
    <style type="text/css">
        body {
            margin: 0;
            height: 80vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            background-image: url('https://i.imgur.com/UARdJvu.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        button {
            background-color: white;
            color: black;
            width: 150px;
            height: 100px;
            font-size: 20px;
            border-radius: 10px;
        }

        /* Style for the custom modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Overlay */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 50%;
            max-width: 500px;
            text-align: center;
            font-size: 18px;
            color: black;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 5px;
            right: 10px;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* No border and no outline for the "Click Me" button */
        .modal-button {
            background-color: transparent;
            color: black;
            font-size: 16px; /* Reduced font size */
            border-radius: 20px;
            padding: 8px 20px; /* Adjusted padding */
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            border: none;  /* Remove border */
            outline: none; /* Remove outline */
            width: auto; /* Automatically adjust to content */
        }
    </style>
</head>
<body>
    <button onclick="showModal()">Click me</button>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <p id="modalText"></p>
            <button class="modal-button" onclick="showNextMessage()">Click Me</button>
        </div>
    </div>

    <script>
        let modal = document.getElementById("myModal");
        let modalText = document.getElementById("modalText");

        let messages = [
            "Happy Birthday Ate! I just want to tell you how grateful I am to have you in my life. Youre not just my sister youre my role model my supporter and one of my favorite people in the world. You are the kindest smartest and most caring person I know. You always go out of your way for others and Ive learned so much from your strength your wisdom and your heart." ,
            "on your special day I hope youre surrounded by love  laughter and everything that makes you happiest. You deserve all the good things life has to offer not just today but every day. I wish you nothing but joy peace success and moments that make your heart full." ,
            "Thank you for being you. I love you always and Im so proud to call you my ate<3"
         ]; 

        let index = 0;

        function showModal() {
            modal.style.display = "flex"; 
            showNextMessage(); // Show the first message
        }

        function showNextMessage() {
            if (index < messages.length) {
                modalText.textContent = messages[index];
                index++;
            } else {
                closeModal();
            }
        }

        function closeModal() {
            modal.style.display = "none";
            index = 0; // Reset the message index when the modal is closed
        }
    </script>
</body>
</html>
